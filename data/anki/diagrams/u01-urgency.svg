<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410">
  <rect class="bg" width="640" height="410"/>
  <text class="t-title" x="24" y="40">Live tariff action: who is maker?</text>
  <text class="t-sm t-muted" x="24" y="68">Business days until the action takes effect</text>

  <!-- three lead-time bands -->
  <rect class="box-accent" x="24" y="88" width="188" height="232" rx="8"/>
  <text class="t mid t-bold" x="118" y="116">Under 5 days</text>
  <text class="t-sm mid t-muted" x="118" y="142">or business-critical</text>
  <path class="line-soft" d="M40 162 H196"/>
  <g data-cloze="lt5"><text class="t mid t-accent" x="118" y="196">Trainer is maker</text></g>
  <text class="t-sm mid" x="118" y="236">other trainer checks;</text>
  <text class="t-sm mid" x="118" y="260">hires shadow and</text>
  <text class="t-sm mid" x="118" y="284">draft in parallel</text>

  <rect class="box" x="226" y="88" width="188" height="232" rx="8"/>
  <text class="t mid t-bold" x="320" y="116">5 to 15 days</text>
  <path class="line-soft" d="M242 162 H398"/>
  <text class="t mid t-bold" x="320" y="196">Hire is maker</text>
  <g data-cloze="mid">
    <text class="t-sm mid" x="320" y="236">checker reviews</text>
    <text class="t-sm mid" x="320" y="260">each draft the same</text>
    <text class="t-sm mid" x="320" y="284">business day</text>
  </g>

  <rect class="box-soft" x="428" y="88" width="188" height="232" rx="8"/>
  <text class="t mid t-bold" x="522" y="116">Over 15 days</text>
  <path class="line-soft" d="M444 162 H600"/>
  <text class="t mid t-bold" x="522" y="196">Hire is maker</text>
  <text class="t-sm mid" x="522" y="236">normal cycle;</text>
  <text class="t-sm mid" x="522" y="260">replaces that week's</text>
  <text class="t-sm mid" x="522" y="284">track session</text>

  <rect class="box" x="24" y="340" width="592" height="48" rx="8"/>
  <text class="t-sm mid" x="320" y="364">In W1–W2 the trainer is always maker</text>
</svg>
