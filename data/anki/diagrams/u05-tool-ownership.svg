<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">Owning a tool at day 60: six points</text>

  <!-- row 1 -->
  <rect class="box" x="24" y="60" width="290" height="96" rx="8"/>
  <text class="t t-bold t-navy" x="40" y="91">1</text>
  <text class="t t-bold" x="64" y="91">Named owner</text>
  <text class="t-sm t-muted" x="40" y="119">in the Tool Inventory</text>
  <text class="t-sm t-muted" x="40" y="141">and in the tool doc</text>

  <rect class="box" x="326" y="60" width="290" height="96" rx="8"/>
  <text class="t t-bold t-navy" x="342" y="91">4</text>
  <text class="t t-bold" x="366" y="91">One change tested</text>
  <text class="t-sm t-muted" x="342" y="119">in the test copy, through</text>
  <text class="t-sm t-muted" x="342" y="141">a change request</text>

  <!-- row 2 (taller: point 2 has three lines) -->
  <rect class="box" x="24" y="166" width="290" height="130" rx="8"/>
  <text class="t t-bold t-navy" x="40" y="196">2</text>
  <text class="t t-bold" x="64" y="196">One end-to-end run</text>
  <g data-cloze="run">
    <text class="t-sm" x="40" y="230">supervised in production</text>
    <text class="t-sm" x="40" y="252">or alone on a test copy</text>
  </g>
  <text class="t-sm t-muted" x="40" y="284">+ can name its failure modes</text>

  <rect class="box" x="326" y="166" width="290" height="130" rx="8"/>
  <text class="t t-bold t-navy" x="342" y="196">5</text>
  <text class="t t-bold" x="366" y="196">Jira backlog current</text>
  <text class="t-sm t-muted" x="342" y="230">known issues and</text>
  <text class="t-sm t-muted" x="342" y="252">enhancements</text>

  <!-- row 3 -->
  <rect class="box" x="24" y="306" width="290" height="104" rx="8"/>
  <text class="t t-bold t-navy" x="40" y="338">3</text>
  <text class="t t-bold" x="64" y="338">Tool doc written</text>
  <text class="t-sm t-muted" x="40" y="370">the Manager could</text>
  <text class="t-sm t-muted" x="40" y="392">follow it alone</text>

  <rect class="box" x="326" y="306" width="290" height="104" rx="8"/>
  <text class="t t-bold t-navy" x="342" y="338">6</text>
  <text class="t t-bold" x="366" y="338">e2open disposition</text>
  <g data-cloze="e2open">
    <text class="t-sm" x="342" y="370">replace, interface,</text>
    <text class="t-sm" x="342" y="392">retire, keep or TBD</text>
  </g>

  <!-- result -->
  <rect class="box-accent" x="24" y="422" width="592" height="46" rx="8"/>
  <text class="t-sm t-bold mid" x="320" y="446">All six: production change rights for that one tool</text>
</svg>
