<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">Owning a tool at day 60: six points</text>

  <!-- row 1 (taller: both points have a third line) -->
  <rect class="box" x="24" y="60" width="290" height="130" rx="8"/>
  <text class="t t-bold t-navy" x="40" y="90">1</text>
  <text class="t t-bold" x="64" y="90">Named owner</text>
  <text class="t-sm" x="40" y="124">in the Tool Inventory</text>
  <text class="t-sm" x="40" y="146">and in the tool doc</text>
  <text class="t-sm t-muted" x="40" y="178">+ old holder becomes Backup</text>

  <rect class="box" x="326" y="60" width="290" height="130" rx="8"/>
  <text class="t t-bold t-navy" x="342" y="90">2</text>
  <text class="t t-bold" x="366" y="90">One end-to-end run</text>
  <g data-cloze="run">
    <text class="t-sm" x="342" y="124">supervised in production</text>
    <text class="t-sm" x="342" y="146">or alone on a test copy</text>
  </g>
  <text class="t-sm t-muted" x="342" y="178">+ can name its failure modes</text>

  <!-- row 2 -->
  <rect class="box" x="24" y="200" width="290" height="100" rx="8"/>
  <text class="t t-bold t-navy" x="40" y="230">3</text>
  <text class="t t-bold" x="64" y="230">Tool doc written</text>
  <text class="t-sm" x="40" y="264">the Manager could</text>
  <text class="t-sm" x="40" y="286">follow it alone</text>

  <rect class="box" x="326" y="200" width="290" height="100" rx="8"/>
  <text class="t t-bold t-navy" x="342" y="230">4</text>
  <text class="t t-bold" x="366" y="230">One change tested</text>
  <text class="t-sm" x="342" y="264">in the test copy, through</text>
  <text class="t-sm" x="342" y="286">a change request</text>

  <!-- row 3 -->
  <rect class="box" x="24" y="310" width="290" height="100" rx="8"/>
  <text class="t t-bold t-navy" x="40" y="340">5</text>
  <text class="t t-bold" x="64" y="340">Jira backlog current</text>
  <text class="t-sm" x="40" y="374">known issues and</text>
  <text class="t-sm" x="40" y="396">enhancements</text>

  <rect class="box" x="326" y="310" width="290" height="100" rx="8"/>
  <text class="t t-bold t-navy" x="342" y="340">6</text>
  <text class="t t-bold" x="366" y="340">e2open disposition</text>
  <g data-cloze="e2open">
    <text class="t-sm" x="342" y="374">replace, interface,</text>
    <text class="t-sm" x="342" y="396">retire, keep or TBD</text>
  </g>

  <!-- result -->
  <rect class="box-accent" x="24" y="422" width="592" height="46" rx="8"/>
  <text class="t-sm t-bold mid" x="320" y="446">All six: production change rights for that one tool</text>
</svg>
