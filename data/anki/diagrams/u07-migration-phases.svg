<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">The e2open migration, phase by phase</text>
  <text class="t-sm t-muted" x="24" y="68">Orange: your day-90 evidence, for your own process</text>

  <path class="line-soft" d="M38 108 V438"/>

  <!-- 1 as-is (day-90 evidence) -->
  <rect class="box" x="64" y="84" width="552" height="48" rx="8"/>
  <circle class="badge-accent" cx="38" cy="108" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="109">1</text>
  <text class="t-sm t-bold" x="80" y="114">As-is</text>
  <text class="t-sm" x="292" y="114">the real process, workarounds too</text>

  <!-- 2 to-be -->
  <rect class="box" x="64" y="139" width="552" height="48" rx="8"/>
  <circle class="badge" cx="38" cy="163" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="164">2</text>
  <text class="t-sm t-bold" x="80" y="169">To-be design</text>
  <g data-cloze="tobe"><text class="t-sm" x="292" y="169">fit-gap; don't rebuild the AS400</text></g>

  <!-- 3 data mapping (day-90 evidence) -->
  <rect class="box" x="64" y="194" width="552" height="48" rx="8"/>
  <circle class="badge-accent" cx="38" cy="218" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="219">3</text>
  <text class="t-sm t-bold" x="80" y="224">Data mapping</text>
  <text class="t-sm" x="292" y="224">field by field, source to target</text>

  <!-- 4 profile and cleanse -->
  <rect class="box" x="64" y="249" width="552" height="48" rx="8"/>
  <circle class="badge" cx="38" cy="273" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="274">4</text>
  <text class="t-sm t-bold" x="80" y="279">Profile &amp; cleanse</text>
  <g data-cloze="cleanse"><text class="t-sm" x="292" y="279">fix at source; data owner decides</text></g>

  <!-- 5 convert and reconcile -->
  <rect class="box" x="64" y="304" width="552" height="48" rx="8"/>
  <circle class="badge" cx="38" cy="328" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="329">5</text>
  <text class="t-sm t-bold" x="80" y="334">Convert &amp; reconcile</text>
  <text class="t-sm" x="292" y="334">counts, totals, samples per load</text>

  <!-- 6 UAT and parallel run -->
  <rect class="box" x="64" y="359" width="552" height="48" rx="8"/>
  <circle class="badge" cx="38" cy="383" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="384">6</text>
  <text class="t-sm t-bold" x="80" y="389">UAT &amp; parallel run</text>
  <g data-cloze="parallel"><text class="t-sm" x="292" y="389">sign-off; old = new, or explained</text></g>

  <!-- 7 cutover and hypercare -->
  <rect class="box" x="64" y="414" width="552" height="48" rx="8"/>
  <circle class="badge" cx="38" cy="438" r="15"/>
  <text class="t-sm t-white mid t-bold" x="38" y="439">7</text>
  <text class="t-sm t-bold" x="80" y="444">Cutover &amp; hypercare</text>
  <text class="t-sm" x="292" y="444">go/no-go, then intensive support</text>
</svg>
