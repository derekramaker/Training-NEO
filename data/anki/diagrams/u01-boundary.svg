<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470">
  <rect class="bg" width="640" height="470"/>
  <text class="t-title" x="24" y="40">The boundary rule</text>
  <text class="t-sm t-muted" x="24" y="68">One owner for each decision in a tariff action</text>

  <!-- the two tracks -->
  <rect class="box" x="24" y="88" width="220" height="156" rx="8"/>
  <text class="t mid t-bold" x="134" y="114">Research</text>
  <text class="t-sm mid t-navy t-bold" x="134" y="140">Hire A · the WHAT</text>
  <text class="t-sm mid" x="134" y="174">scope, in-scope items,</text>
  <text class="t-sm mid" x="134" y="198">HTS codes, rates,</text>
  <text class="t-sm mid" x="134" y="222">dates, stacking</text>

  <rect class="box" x="396" y="88" width="220" height="156" rx="8"/>
  <text class="t mid t-bold" x="506" y="114">Standard Cost</text>
  <text class="t-sm mid t-navy t-bold" x="506" y="140">Hire B · the $</text>
  <text class="t-sm mid" x="506" y="174">landed cost, margin,</text>
  <text class="t-sm mid" x="506" y="198">Oracle cost update,</text>
  <text class="t-sm mid" x="506" y="222">variance</text>

  <!-- the handoff -->
  <text class="t-sm mid t-accent" x="320" y="132">Tariff-Impact</text>
  <text class="t-sm mid t-accent" x="320" y="154">Brief</text>
  <path class="arrow-accent" d="M250 172 H390"/>
  <text class="t-sm mid t-muted" x="320" y="196">no $ in it</text>

  <!-- shared workbook -->
  <path class="arrow-soft" d="M134 250 V280"/>
  <path class="arrow-soft" d="M506 250 V280"/>
  <rect class="box-soft" x="24" y="286" width="592" height="66" rx="8"/>
  <text class="t mid t-bold" x="320" y="308">One shared Tariff-Impact Model</text>
  <text class="t-sm mid" x="320" y="334">Standard Cost never decides scope</text>

  <!-- control before release -->
  <path class="arrow" d="M224 358 V386"/>
  <rect class="box" x="24" y="392" width="400" height="64" rx="8"/>
  <g data-cloze="checker">
    <text class="t mid t-bold t-navy" x="224" y="414">Checker review</text>
    <text class="t-sm mid" x="224" y="439">Senior or Manager signs off</text>
  </g>
  <path class="arrow" d="M430 424 H462"/>
  <rect class="box-soft" x="468" y="392" width="148" height="64" rx="8"/>
  <text class="t-sm mid t-bold" x="542" y="414">Release to</text>
  <text class="t-sm mid t-bold" x="542" y="438">the business</text>
</svg>
