<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">The life of a US entry</text>
  <text class="t-sm t-muted" x="24" y="68">Not to scale. Timings as the customs primer gives them</text>

  <!-- timeline -->
  <path class="line" d="M40 232 H604"/>
  <circle class="badge" cx="64" cy="232" r="16"/>
  <text class="t-sm t-white mid t-bold" x="64" y="233">1</text>
  <circle class="badge" cx="186" cy="232" r="16"/>
  <text class="t-sm t-white mid t-bold" x="186" y="233">2</text>
  <circle class="badge" cx="320" cy="232" r="16"/>
  <text class="t-sm t-white mid t-bold" x="320" y="233">3</text>
  <circle class="badge-accent" cx="458" cy="232" r="16"/>
  <text class="t-sm t-white mid t-bold" x="458" y="233">4</text>
  <circle class="badge" cx="576" cy="232" r="16"/>
  <text class="t-sm t-white mid t-bold" x="576" y="233">5</text>

  <!-- 1 above, left-aligned -->
  <text class="t t-bold" x="24" y="113">Arrival</text>
  <text class="t-sm t-muted" x="24" y="145">goods reach</text>
  <text class="t-sm t-muted" x="24" y="169">a US port</text>
  <path class="line-soft" d="M64 180 V210"/>

  <!-- 2 below -->
  <path class="line-soft" d="M186 254 V276"/>
  <text class="t mid t-bold" x="186" y="298">Entry and release</text>
  <text class="t-sm mid t-muted" x="186" y="330">entry generally within</text>
  <text class="t-sm mid t-muted" x="186" y="354">15 days of arrival</text>

  <!-- 3 above -->
  <g data-cloze="summary"><text class="t mid t-bold" x="320" y="106">Entry summary</text></g>
  <text class="t-sm mid t-muted" x="320" y="138">within 10 working days</text>
  <text class="t-sm mid t-muted" x="320" y="162">of release; duty deposited</text>
  <path class="line-soft" d="M320 180 V210"/>

  <!-- 4 below (accent: the final computation) -->
  <path class="line-soft" d="M458 254 V276"/>
  <g data-cloze="liq"><text class="t mid t-accent" x="458" y="298">Liquidation</text></g>
  <text class="t-sm mid t-muted" x="458" y="330">ACE: about 314 days</text>
  <text class="t-sm mid t-muted" x="458" y="354">after entry (limit 1 year)</text>

  <!-- 5 above, right-aligned -->
  <g data-cloze="protest"><text class="t end t-bold" x="616" y="113">Protest</text></g>
  <text class="t-sm end t-muted" x="616" y="145">within 180 days</text>
  <text class="t-sm end t-muted" x="616" y="169">of liquidation</text>
  <path class="line-soft" d="M576 180 V210"/>

  <!-- correction window between 3 and 4, explained in the box below -->
  <path class="line-dash" d="M342 218 H436"/>
  <rect class="box-warn" x="24" y="380" width="592" height="88" rx="8"/>
  <path class="line-dash" d="M40 409 H84"/>
  <g data-cloze="psc"><text class="t t-bold" x="102" y="416">Post Summary Correction (PSC)</text></g>
  <text class="t-sm" x="40" y="452">fixes errors: within 300 days of entry, 15+ days before liquidation</text>
</svg>
