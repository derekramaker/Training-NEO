<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470">
  <rect class="bg" width="640" height="470"/>
  <text class="t-title" x="24" y="40">Reading a new US tariff action</text>
  <text class="t-sm t-muted" x="24" y="68">Typical order of appearance. Row 1 is only a lead.</text>

  <!-- 1 lead -->
  <circle class="badge" cx="40" cy="118" r="16"/>
  <text class="t-sm t-white mid t-bold" x="40" y="119">1</text>
  <rect class="box-ghost" x="72" y="84" width="544" height="68" rx="8"/>
  <text class="t t-bold" x="88" y="112">Press release, fact sheet, news</text>
  <text class="t-sm t-muted" x="88" y="140">a lead: use it to find the instrument</text>

  <!-- 2 instrument -->
  <circle class="badge-accent" cx="40" cy="194" r="16"/>
  <text class="t-sm t-white mid t-bold" x="40" y="195">2</text>
  <rect class="box-accent" x="72" y="160" width="544" height="68" rx="8"/>
  <g data-cloze="instrument"><text class="t t-bold" x="88" y="188">Proclamation, executive order, notice</text></g>
  <text class="t-sm t-muted" x="88" y="216">the legal text: it governs</text>

  <!-- 3 Federal Register -->
  <circle class="badge" cx="40" cy="270" r="16"/>
  <text class="t-sm t-white mid t-bold" x="40" y="271">3</text>
  <rect class="box" x="72" y="236" width="544" height="68" rx="8"/>
  <g data-cloze="fr"><text class="t t-bold" x="88" y="264">Federal Register</text></g>
  <text class="t-sm t-muted" x="88" y="292">official citation and annexes</text>

  <!-- 4 CSMS -->
  <circle class="badge" cx="40" cy="346" r="16"/>
  <text class="t-sm t-white mid t-bold" x="40" y="347">4</text>
  <rect class="box" x="72" y="312" width="544" height="68" rx="8"/>
  <g data-cloze="csms"><text class="t t-bold" x="88" y="340">CBP CSMS message</text></g>
  <text class="t-sm t-muted" x="88" y="368">Chapter 99 numbers, reporting order</text>

  <!-- 5 HTSUS -->
  <circle class="badge" cx="40" cy="422" r="16"/>
  <text class="t-sm t-white mid t-bold" x="40" y="423">5</text>
  <rect class="box" x="72" y="388" width="544" height="68" rx="8"/>
  <g data-cloze="ch99"><text class="t t-bold" x="88" y="416">HTSUS Chapter 99 (9903)</text></g>
  <text class="t-sm t-muted" x="88" y="444">official schedule; can lag days or weeks</text>
</svg>
