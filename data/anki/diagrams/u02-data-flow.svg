<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" width="640" height="478">
  <rect class="bg" width="640" height="478"/>
  <text class="t-title" x="24" y="40">Files to and from the brokers</text>
  <text class="t-sm t-muted" x="24" y="68">Generic AS400 pattern: confirm ours in the walkthrough</text>

  <!-- column headings -->
  <text class="t-sm t-bold t-navy" x="24" y="98">Data out</text>
  <text class="t-sm t-bold t-navy" x="336" y="98">Data back</text>

  <!-- data out: down the left -->
  <rect class="box" x="24" y="108" width="280" height="82" rx="8"/>
  <text class="t t-bold mid" x="164" y="132">Trade master files</text>
  <text class="t-sm mid" x="164" y="166">codes, origin, USMCA flags</text>

  <path class="arrow" d="M164 190 V234"/>
  <g data-cloze="job"><text class="t-sm t-bold" x="180" y="221">nightly batch job</text></g>

  <rect class="box" x="24" y="240" width="280" height="82" rx="8"/>
  <text class="t t-bold mid" x="164" y="264">Product file</text>
  <g data-cloze="delta"><text class="t-sm mid" x="164" y="298">full or delta, one per broker</text></g>

  <path class="arrow" d="M164 322 V348"/>

  <!-- brokers -->
  <rect class="box-soft" x="24" y="354" width="592" height="46" rx="8"/>
  <text class="t mid" x="320" y="377"><tspan class="t-bold">Brokers</tspan> file with CBP, CBSA and ANAM</text>

  <!-- data back: up the right -->
  <path class="arrow" d="M476 354 V328"/>

  <rect class="box" x="336" y="240" width="280" height="82" rx="8"/>
  <g data-cloze="entry"><text class="t t-bold mid" x="476" y="264">Entry data file</text></g>
  <text class="t-sm mid" x="476" y="298">every filed line, per broker</text>

  <path class="arrow" d="M476 240 V196"/>

  <rect class="box" x="336" y="108" width="280" height="82" rx="8"/>
  <text class="t t-bold mid" x="476" y="132">Data warehouse</text>
  <g data-cloze="match"><text class="t-sm mid" x="476" y="166">match each line to an item</text></g>

  <!-- control on every file -->
  <rect class="box-accent" x="24" y="412" width="592" height="46" rx="8"/>
  <text class="t-sm t-bold" x="122" y="441">Every file:</text>
  <g data-cloze="trailer"><text class="t-sm" x="228" y="441">trailer with record count and totals</text></g>
</svg>
