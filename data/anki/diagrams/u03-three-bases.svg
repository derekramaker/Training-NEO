<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <rect class="bg" width="640" height="440"/>
  <text class="t-title" x="24" y="40">One purchase, three duty bases</text>
  <text class="t-sm t-muted" x="24" y="68">Fictional purchase from Country X, all in US$</text>

  <foreignObject x="24" y="86" width="592" height="252">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wt">
      <table>
        <tr><th>Element</th><th class="num">US</th><th class="num">Canada</th><th class="num">Mexico</th></tr>
        <tr><td>Invoice price, FOB</td><td class="num">10,000</td><td class="num">10,000</td><td class="num">10,000</td></tr>
        <tr><td>Mold assist (apportioned)</td><td class="num">1,000</td><td class="num">1,000</td><td class="num">1,000</td></tr>
        <tr><td>Buying commission 200</td><td class="num">0</td><td class="num">0</td><td class="num">0</td></tr>
        <tr class="hl"><td>Freight 800 + insurance 50</td><td class="num">0</td><td class="num">0</td><td class="num">850</td></tr>
        <tr class="total"><td>Customs value</td><td class="num">11,000</td><td class="num">11,000</td><td class="num">11,850</td></tr>
      </table>
    </div>
  </foreignObject>

  <rect class="box" x="24" y="330" width="592" height="96" rx="8"/>
  <text class="t-sm" x="40" y="358"><tspan class="t-bold">US:</tspan> international freight and insurance left out</text>
  <text class="t-sm" x="40" y="384"><tspan class="t-bold">Canada:</tspan> left out after the place of direct shipment</text>
  <text class="t-sm" x="40" y="410"><tspan class="t-bold">Mexico:</tspan> added until the goods arrive (CIF-like)</text>
</svg>
