<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432">
  <rect class="bg" width="640" height="432"/>
  <text class="t-title" x="24" y="40">Reading an ECCN: 3A001</text>
  <text class="t-sm t-muted" x="24" y="68">Export Control Classification Number, on the CCL</text>

  <!-- row 1: category -->
  <rect class="box-strong" x="24" y="88" width="112" height="68" rx="8"/>
  <text class="t-lg t-white mid t-mono" x="80" y="123">3</text>
  <text class="t t-bold" x="160" y="116">CCL category, 0 to 9</text>
  <text class="t t-muted" x="160" y="144">3 = electronics</text>

  <!-- row 2: product group -->
  <rect class="box-strong" x="24" y="168" width="112" height="68" rx="8"/>
  <text class="t-lg t-white mid t-mono" x="80" y="203">A</text>
  <text class="t t-bold" x="160" y="196">Product group, A to E</text>
  <text class="t t-muted" x="160" y="224">A = systems, equipment, components</text>

  <!-- row 3: reason for control -->
  <rect class="box-accent" x="24" y="248" width="112" height="68" rx="8"/>
  <text class="t-lg mid t-mono" x="80" y="283">001</text>
  <g data-cloze="reason">
    <text class="t t-accent" x="160" y="276">Reason for control</text>
    <text class="t" x="160" y="304">0xx series = national security</text>
  </g>

  <!-- EAR99 -->
  <rect class="box-soft" x="24" y="336" width="592" height="76" rx="8"/>
  <g data-cloze="ear99"><text class="t-lg t-mono mid" x="92" y="375">EAR99</text></g>
  <path class="line-soft" d="M160 350 V398"/>
  <text class="t" x="176" y="368">Subject to the EAR, not on the CCL:</text>
  <text class="t" x="176" y="394">usually no license needed</text>
</svg>
