<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">Four ways a good is USMCA-originating</text>
  <text class="t-sm t-muted" x="24" y="68">Origin criteria A to D (USMCA Art. 4.2)</text>

  <!-- A -->
  <rect class="box" x="24" y="82" width="592" height="46" rx="8"/>
  <circle class="badge" cx="54" cy="105" r="16"/>
  <text class="t-sm t-white mid t-bold" x="54" y="106">A</text>
  <g data-cloze="crita"><text class="t" x="84" y="112">Wholly obtained or produced in the region</text></g>

  <!-- B: the path for goods with non-originating materials -->
  <rect class="box-accent" x="24" y="136" width="592" height="220" rx="8"/>
  <circle class="badge-accent" cx="54" cy="162" r="16"/>
  <text class="t-sm t-white mid t-bold" x="54" y="163">B</text>
  <g data-cloze="critb"><text class="t" x="84" y="169">Meets the product-specific rule (Annex 4-B)</text></g>
  <text class="t-sm t-muted" x="84" y="196">for goods with non-originating materials</text>

  <rect class="box" x="44" y="210" width="268" height="104" rx="8"/>
  <g data-cloze="shift"><text class="t t-bold" x="60" y="243">Tariff shift</text><text class="t-sm" x="60" y="271">each non-originating</text><text class="t-sm" x="60" y="295">material changes HS code</text></g>
  <rect class="box" x="328" y="210" width="268" height="104" rx="8"/>
  <g data-cloze="rvc"><text class="t t-bold" x="344" y="243">Regional value content</text><text class="t-sm" x="344" y="271">regional share of value</text><text class="t-sm" x="344" y="295">meets the rule's threshold</text></g>
  <text class="t-sm mid t-muted" x="320" y="335">The rule says which: one, either, or both</text>

  <!-- C -->
  <rect class="box" x="24" y="366" width="592" height="46" rx="8"/>
  <circle class="badge" cx="54" cy="389" r="16"/>
  <text class="t-sm t-white mid t-bold" x="54" y="390">C</text>
  <g data-cloze="critc"><text class="t" x="84" y="396">Made exclusively from originating materials</text></g>

  <!-- D -->
  <rect class="box" x="24" y="422" width="592" height="46" rx="8"/>
  <circle class="badge" cx="54" cy="445" r="16"/>
  <text class="t-sm t-white mid t-bold" x="54" y="446">D</text>
  <text class="t" x="84" y="452">Narrow cases decided by an RVC test</text>
</svg>
