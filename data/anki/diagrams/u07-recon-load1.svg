<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">Test load 1: does it reconcile?</text>
  <text class="t-sm t-muted" x="24" y="68">Illustrative: classification master, AS400 to e2open</text>

  <foreignObject x="24" y="84" width="592" height="232">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wt">
      <table>
        <tr><th>Check</th><th class="num">AS400</th><th class="num">e2open</th><th class="num">Diff</th><th>Result</th></tr>
        <tr><td>All records</td><td class="num">41,250</td><td class="num">41,232</td><td class="num">18</td><td>Pass *</td></tr>
        <tr><td>US records</td><td class="num">13,750</td><td class="num">13,744</td><td class="num">6</td><td>Pass *</td></tr>
        <tr><td>Required blanks</td><td class="num">n/a</td><td class="num">0</td><td class="num">0</td><td>Pass</td></tr>
        <tr class="hl"><td>Sample rows</td><td class="num">40</td><td class="num">39 match</td><td class="num">1</td><td>Fail</td></tr>
      </table>
      <div class="note">Sample = 25 random rows + 15 edge cases</div>
    </div>
  </foreignObject>

  <rect class="box-ok" x="24" y="316" width="592" height="68" rx="8"/>
  <text class="t-sm" x="40" y="342"><tspan class="t-ok">* 18 rows</tspan> = 6 items × 3 countries (6 of them US):</text>
  <text class="t-sm" x="40" y="368">not in the Oracle item master, excluded with approval</text>

  <rect class="box-accent" x="24" y="396" width="592" height="68" rx="8"/>
  <text class="t-sm" x="40" y="422"><tspan class="t-accent">Fail:</tspan> a 1990s date loaded as 2090s</text>
  <text class="t-sm" x="40" y="448">Fix the conversion, reload, re-run every check</text>
</svg>
