<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476">
  <rect class="bg" width="640" height="476"/>
  <text class="t-title" x="24" y="40">Effective duty rate by HTS chapter</text>
  <text class="t-sm t-muted" x="24" y="68">Fictional entry lines. Values in US$.</text>

  <foreignObject x="24" y="84" width="592" height="192">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wt">
      <table>
        <tr><th>Line</th><th>Chapter</th><th class="num">Value</th><th class="num">Duty</th><th class="num">Line rate</th></tr>
        <tr><td>1</td><td>73</td><td class="num">20,000</td><td class="num">1,200</td><td class="num">6.0%</td></tr>
        <tr><td>2</td><td>73</td><td class="num">40,000</td><td class="num">800</td><td class="num">2.0%</td></tr>
        <tr><td>3</td><td>84</td><td class="num">10,000</td><td class="num">800</td><td class="num">8.0%</td></tr>
        <tr><td>4</td><td>84</td><td class="num">30,000</td><td class="num">600</td><td class="num">2.0%</td></tr>
      </table>
    </div>
  </foreignObject>

  <path class="arrow" d="M48 280 V314"/>
  <text class="t-sm t-mono t-bold" x="64" y="303">GROUP BY LEFT(hts10, 2)</text>

  <foreignObject x="24" y="320" width="592" height="118">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wt">
      <table>
        <tr><th>Chapter</th><th class="num">Value</th><th class="num">Duty</th><th class="num">SUM(duty) / SUM(value)</th></tr>
        <tr class="hl"><td>73</td><td class="num">60,000</td><td class="num">2,000</td><td class="num">3.33%</td></tr>
        <tr><td>84</td><td class="num">40,000</td><td class="num">1,400</td><td class="num">3.50%</td></tr>
      </table>
    </div>
  </foreignObject>

  <text class="t-sm t-bad" x="24" y="460">Chapter 73 is not the AVG of line rates: (6% + 2%) / 2 = 4%</text>
</svg>
