<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" width="640" height="472">
  <rect class="bg" width="640" height="472"/>
  <text class="t-title" x="24" y="40">How our data platform connects</text>
  <text class="t-sm t-muted" x="24" y="68">Generic map: walk back one link at a time</text>

  <!-- you: interactive work with your personal login -->
  <circle class="badge" cx="336" cy="130" r="26"/>
  <text class="t-sm t-white t-bold mid" x="336" y="131">You</text>
  <path class="line-dash" d="M310 130 H214"/>
  <path class="line-dash" d="M362 130 H452"/>
  <path class="line-dash" d="M316 146 L196 244"/>

  <!-- left column: Oracle EBS, team database, remote server -->
  <rect class="box" x="24" y="96" width="190" height="68" rx="8"/>
  <text class="t t-bold mid" x="119" y="121">Oracle EBS</text>
  <text class="t-sm t-muted mid" x="119" y="148">items, costs, POs</text>

  <path class="arrow" d="M119 164 V238"/>
  <g data-cloze="load">
    <text class="t-sm end" x="105" y="196">scheduled</text>
    <text class="t-sm end" x="105" y="218">copy</text>
  </g>

  <rect class="box" x="24" y="244" width="190" height="78" rx="8"/>
  <text class="t t-bold mid" x="119" y="271">Team database</text>
  <text class="t-sm t-muted mid" x="119" y="300">SQL Server, views</text>

  <path class="line" d="M119 322 V380"/>
  <text class="t-sm" x="131" y="345">scheduled</text>
  <text class="t-sm" x="131" y="367">jobs</text>

  <rect class="box" x="24" y="380" width="190" height="68" rx="8"/>
  <text class="t t-bold mid" x="119" y="405">Remote server</text>
  <text class="t-sm t-muted mid" x="119" y="432">Task Scheduler</text>

  <!-- middle: the gateway -->
  <path class="line" d="M214 283 H246"/>
  <rect class="box-accent" x="246" y="226" width="180" height="132" rx="8"/>
  <g data-cloze="gateway">
    <text class="t-sm t-bold mid" x="336" y="253">On-premises</text>
    <text class="t-sm t-bold mid" x="336" y="275">data gateway</text>
  </g>
  <g data-cloze="cred">
    <text class="t-sm mid" x="336" y="311">one stored</text>
    <text class="t-sm mid" x="336" y="333">credential</text>
  </g>

  <!-- right column: Power BI, flows and apps -->
  <path class="arrow" d="M396 226 V160 H446"/>
  <text class="t-sm end" x="386" y="202">refresh</text>
  <rect class="box" x="452" y="96" width="164" height="114" rx="8"/>
  <text class="t t-bold mid" x="534" y="121">Power BI</text>
  <g data-cloze="model"><text class="t-sm mid" x="534" y="156">semantic model</text></g>
  <text class="t-sm t-muted mid" x="534" y="192">→ reports</text>

  <path class="line" d="M426 283 H452"/>
  <rect class="box" x="452" y="242" width="164" height="84" rx="8"/>
  <text class="t-sm t-bold mid" x="534" y="266">Flows and apps</text>
  <text class="t-sm t-muted mid" x="534" y="291">Power Automate</text>
  <text class="t-sm t-muted mid" x="534" y="314">Power Apps</text>

  <!-- legend -->
  <path class="line" d="M280 390 H328"/>
  <text class="t-sm" x="340" y="396">a saved connection or job</text>
  <path class="line-dash" d="M280 428 H328"/>
  <text class="t-sm" x="340" y="434">you, with your personal login</text>
</svg>
