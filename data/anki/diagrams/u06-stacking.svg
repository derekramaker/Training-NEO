<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" width="640" height="448">
  <rect class="bg" width="640" height="448"/>
  <text class="t-title" x="24" y="40">Adds, displaces or replaces?</text>
  <text class="t-sm t-muted" x="24" y="68">Fictional PART-A, customs value $200.00; hypothetical rates</text>

  <rect class="box-soft" x="24" y="86" width="592" height="50" rx="8"/>
  <text class="t mid" x="320" y="111"><tspan class="t-bold">Today:</tspan> 2.5% base + 10% Action Y = 12.5% ($25.00)</text>

  <foreignObject x="24" y="150" width="592" height="156">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wt">
      <table>
        <tr><th>What happens</th><th>Working</th><th class="num">Rate</th><th class="num">Duty</th></tr>
        <tr class="hl"><td>New 25% <b>adds</b></td><td>12.5% + 25%</td><td class="num">37.5%</td><td class="num">$75.00</td></tr>
        <tr><td>New 25% <b>displaces</b> Y</td><td>12.5% + 25% − 10%</td><td class="num">27.5%</td><td class="num">$55.00</td></tr>
        <tr><td>Y rises to 20%</td><td>12.5% + 20% − 10%</td><td class="num">22.5%</td><td class="num">$45.00</td></tr>
      </table>
    </div>
  </foreignObject>

  <rect class="box" x="24" y="318" width="592" height="114" rx="8"/>
  <text class="t-sm" x="40" y="347"><tspan class="t-bold">Adds:</tspan> the default when the text is silent.</text>
  <text class="t-sm" x="40" y="381"><tspan class="t-bold">Displaces:</tspan> the new action's text switches Y off.</text>
  <g data-cloze="replace"><text class="t-sm" x="40" y="415"><tspan class="t-bold">Replaces:</tspan> Y's own rate changes; old rate comes off.</text></g>
</svg>
