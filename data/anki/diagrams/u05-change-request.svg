<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" width="640" height="456">
  <rect class="bg" width="640" height="456"/>
  <text class="t-title" x="24" y="40">Changing a tool safely</text>
  <text class="t-sm t-muted" x="24" y="68">Every change, whatever its size, follows these steps</text>

  <!-- row 1: describe, build on a copy, test -->
  <rect class="box" x="24" y="88" width="184" height="104" rx="8"/>
  <text class="t t-bold mid" x="116" y="118">Change request</text>
  <text class="t-sm t-muted mid" x="116" y="152">before and after,</text>
  <text class="t-sm t-muted mid" x="116" y="176">impact, risk</text>

  <rect class="box" x="228" y="88" width="184" height="104" rx="8"/>
  <text class="t t-bold mid" x="320" y="118">Change a copy</text>
  <text class="t-sm t-muted mid" x="320" y="152">never the</text>
  <text class="t-sm t-muted mid" x="320" y="176">production file</text>

  <rect class="box" x="432" y="88" width="184" height="104" rx="8"/>
  <g data-cloze="regression"><text class="t t-bold mid" x="524" y="118">Regression test</text></g>
  <text class="t-sm t-muted mid" x="524" y="152">old vs new,</text>
  <text class="t-sm t-muted mid" x="524" y="176">same input</text>

  <path class="arrow" d="M208 140 H222"/>
  <path class="arrow" d="M412 140 H426"/>
  <path class="arrow" d="M524 192 V212 H116 V230"/>

  <!-- row 2: plan the way back, review, implement -->
  <rect class="box" x="24" y="236" width="184" height="104" rx="8"/>
  <g data-cloze="rollback"><text class="t t-bold mid" x="116" y="266">Rollback plan</text></g>
  <text class="t-sm t-muted mid" x="116" y="300">trigger, steps,</text>
  <text class="t-sm t-muted mid" x="116" y="324">verified backup</text>

  <rect class="box" x="228" y="236" width="184" height="104" rx="8"/>
  <text class="t t-bold mid" x="320" y="266">Checker review</text>
  <text class="t-sm t-muted mid" x="320" y="300">by the Manager,</text>
  <text class="t-sm t-muted mid" x="320" y="324">then approval</text>

  <rect class="box" x="432" y="236" width="184" height="104" rx="8"/>
  <text class="t t-bold mid" x="524" y="266">Implement</text>
  <text class="t-sm t-muted mid" x="524" y="300">then check the</text>
  <text class="t-sm t-muted mid" x="524" y="324">first run</text>

  <path class="arrow" d="M208 288 H222"/>
  <path class="arrow" d="M412 288 H426"/>

  <!-- the rule -->
  <rect class="box-accent" x="24" y="364" width="592" height="68" rx="8"/>
  <text class="t-sm t-bold mid" x="320" y="388">Before day 60: no production writes.</text>
  <text class="t-sm mid" x="320" y="414">You stop after testing; the Manager implements.</text>
</svg>
