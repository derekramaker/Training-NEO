<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect class="bg" width="640" height="480"/>
  <text class="t-title" x="24" y="40">How our trade data flows today</text>
  <text class="t-sm t-muted" x="24" y="68">Generic flow; the Manager shows our details in M2</text>

  <!-- left column: our systems -->
  <rect class="box" x="24" y="88" width="246" height="84" rx="8"/>
  <g data-cloze="oracle"><text class="t mid t-bold" x="147" y="116">Oracle ERP</text></g>
  <text class="t-sm mid t-muted" x="147" y="150">items, POs, standard cost</text>

  <rect class="box" x="24" y="216" width="246" height="170" rx="8"/>
  <text class="t mid t-bold" x="147" y="243">AS400 trade system</text>
  <text class="t-sm mid t-muted" x="147" y="268">classification, origin</text>
  <rect class="box-accent" x="40" y="286" width="214" height="88" rx="6"/>
  <text class="t-sm mid" x="147" y="309">To be replaced by</text>
  <g data-cloze="e2open"><text class="t mid t-accent" x="147" y="344">e2open GTM</text></g>

  <!-- right column: outside parties -->
  <rect class="box" x="400" y="88" width="216" height="84" rx="8"/>
  <text class="t mid t-bold" x="508" y="116">Customs agencies</text>
  <text class="t-sm mid t-muted" x="508" y="150">CBP · CBSA · ANAM</text>

  <rect class="box" x="400" y="216" width="216" height="96" rx="8"/>
  <text class="t mid t-bold" x="508" y="250">Licensed brokers</text>
  <text class="t-sm mid t-muted" x="508" y="280">US · Canada · Mexico</text>

  <!-- bottom: reporting -->
  <rect class="box-soft" x="24" y="424" width="592" height="44" rx="8"/>
  <text class="t mid" x="320" y="446"><tspan class="t-bold">Reporting:</tspan> SQL Server · warehouse · Power BI</text>

  <!-- flows -->
  <path class="arrow" d="M147 178 V210"/>
  <text class="t-sm" x="160" y="200">items</text>
  <path class="arrow" d="M276 264 H394"/>
  <text class="t-sm mid" x="335" y="248">product file</text>
  <path class="arrow" d="M508 210 V178"/>
  <text class="t-sm end" x="496" y="200">declarations</text>
  <path class="arrow-soft" d="M147 392 V418"/>
  <path class="arrow-soft" d="M508 318 V418"/>
  <text class="t-sm end" x="496" y="374">entry data back</text>
</svg>
